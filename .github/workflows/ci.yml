name: CI

# Corre en cada push a cualquier rama, para que ningún cambio llegue a
# develop/qa/main sin compilar, pasar lint y tests. No se usa además
# `pull_request`: el check queda asociado al commit y el PR lo muestra
# igual, así se evita correr todo dos veces por cada push.
on:
  push:
    branches: ["**"]

# Si llega un push nuevo a la misma rama, cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, build y tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci falla si package-lock.json no está sincronizado con package.json.
      - name: Instalar dependencias
        run: npm ci

      # Bloquea dependencias con vulnerabilidades altas o críticas.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build (dev, qa y production)
        run: |
          npm run build -- --mode dev
          npm run build -- --mode qa
          npm run build -- --mode production

      # Exige que pase al menos el 80% de los tests (TEST_PASS_THRESHOLD).
      # Si el porcentaje es menor, o un archivo de test o un hook está roto, falla.
      # Se salta en ramas que todavía no tienen el script (por ejemplo main).
      - name: Tests (mínimo 80% deben pasar)
        if: hashFiles('scripts/check-test-pass-rate.mjs') != ''
        env:
          TEST_PASS_THRESHOLD: 80
        run: |
          rm -f test-summary.json
          npm run test:ci || true
          node scripts/check-test-pass-rate.mjs
